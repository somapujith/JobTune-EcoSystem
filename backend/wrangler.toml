name = "jobtune-ecosystem"
main = "src/worker-entry.js"
compatibility_date = "2026-09-14"
compatibility_flags = ["nodejs_compat"]
account_id = "af2854d5e1c39fde573717202a1deb36"

# Cloudflare Workers port (docs/migration/ADR-001-cloudflare-workers-port.md): the entry is
# wired to the FULL Hono app in src/worker/ (all 41 Express route files, 184 endpoints + the /admin page).
# Render stays authoritative; no production traffic is routed here (frontend/vercel.json still points at Render).
#
# !! DO NOT set JWT_SECRET or DATABASE_URL on the deployed Worker until rate limiting is provisioned
# !! (the [[ratelimits]] block below) and docs/migration/verification-runbook.md checklist items 1, 7, 16 and 18 are done.
# !! Without secrets every route fails closed (masked 500; /api/health reports "degraded") and no database is contacted.
# !! With them, the public .workers.dev URL serves the whole API with NO brute-force protection on /api/auth/login
# !! (bcryptjs ~60-70 ms CPU per attempt) and one Neon pool + one audit_logs insert per anonymous request.

[observability]
enabled = true

# Build-time module aliases for the document / upload routes (/api/resume, /api/ats). Each one is required and
# was proven by the Phase 0 spike (backend/spike/docs/wrangler.fixed.toml, docs/CLOUDFLARE_MIGRATION.md). Paths
# are relative to THIS file. Only the "docs" porting slice edits this section.
#   @aws-sdk/client-s3  unzipper's optional S3 source is not installed; unresolved, the whole bundle fails to build.
#   node-ensure         pdf.js v1.10.100 (inside pdf-parse) recurses forever through node-ensure's "browser" field.
#   pdfkit              the default entry needs __dirname / fs; the standalone build has the AFM fonts inlined.
[alias]
"@aws-sdk/client-s3" = "./src/worker/stubs/aws-sdk-client-s3.mjs"
"node-ensure" = "./src/worker/stubs/node-ensure.cjs"
"pdfkit" = "./node_modules/pdfkit/js/pdfkit.standalone.js"

# Secrets (JWT_SECRET, DATABASE_URL, ADZUNA_APP_KEY, etc.) must be set via
# `wrangler secret put <NAME>` — do NOT put them in this file or commit them.
# Non-secret config can go under [vars] once the real entry is wired up, e.g.:
# [vars]
# FRONTEND_URL = "https://your-app.pages.dev"

# Static asset serving for the admin bundle / frontend build once ported —
# Workers has no filesystem, so anything currently read via fs.readFileSync
# (backend/src/ssr/setupFrontend.js, backend/src/public/admin) needs to move
# to Cloudflare's Assets binding instead. Left commented until that porting
# work happens.
# [assets]
# directory = "./public"
# binding = "ASSETS"

# Rate limiting (ADR-001 4.4, T1.9): NOT provisioned. The Express in-memory limiter is not
# ported. Uncommenting these creates Workers Rate Limiting bindings on the next deploy; see
# docs/migration/rate-limiting.md for why the numbers are an approximation (period can only be
# 10 or 60 seconds) and what must be verified first (checklist item 18).
# [[ratelimits]]
# name = "API_LIMITER"
# namespace_id = "1001"
# simple = { limit = 100, period = 60 }
#
# [[ratelimits]]
# name = "AUTH_LIMITER"
# namespace_id = "1002"
# simple = { limit = 5, period = 60 }
